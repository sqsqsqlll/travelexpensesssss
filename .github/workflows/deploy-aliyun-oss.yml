name: Deploy to Aliyun OSS

# 账本发布到 OSS 根目录，行程规划（Do-Travel-Plan-Page）发布到 plan/。
# 行程规划仓库的改动不会触发这里，所以每小时自动检查一次（没变化的文件会跳过），也可以手动运行。
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: deploy-aliyun-oss
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$ALIYUN_ACCESS_KEY_ID" ] || [ -z "$ALIYUN_ACCESS_KEY_SECRET" ] || [ -z "$OSS_BUCKET" ] || [ -z "$OSS_ENDPOINT" ]; then
            echo "::notice::未配置阿里云 Secrets/Variables，跳过部署（见 docs/deploy-aliyun-oss-zh.md）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - name: Checkout trip planner
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: sqsqsqlll/Do-Travel-Plan-Page
          ref: main
          path: _plan
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Upload to OSS
        if: steps.cfg.outputs.ready == 'true'
        env:
          PLAN_DIR: _plan
        run: |
          python -m pip install --quiet --upgrade pip setuptools wheel
          pip install --quiet "oss2==2.19.1"
          python scripts/deploy_oss.py
