name: Rebuild travel.sqsqsq.online

# 账本合并到 main 后触发 Cloudflare Pages 重新构建（Cloudflare 自己的 GitHub 推送通知收不到时的保险）
# 需要仓库 Secret：LEDGER_DEPLOY_HOOK = Cloudflare Pages 部署钩子地址
#（Cloudflare → Workers & Pages → travelexpensesssss → Settings → Builds → Deploy hooks → plan-page-updated）
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.LEDGER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::未设置 Secret LEDGER_DEPLOY_HOOK，没有触发部署"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "已触发 travel.sqsqsq.online 重新构建"
